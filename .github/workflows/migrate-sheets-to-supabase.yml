name: Migrate Sheets To Supabase

on:
  workflow_dispatch:
    inputs:
      truncateDestination:
        description: Clear Supabase destination tables before migrating
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Print runtime info
        run: |
          node --version
          npm --version

      - name: Run migration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEGACY_GOOGLE_SHEET_ID: ${{ secrets.LEGACY_GOOGLE_SHEET_ID }}
          MIGRATION_TRUNCATE_DESTINATION: ${{ github.event.inputs.truncateDestination }}
        run: npm run migrate:sheets-to-supabase